<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Kopi Kenangan Senja</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: #0b0b0b;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .login-card {
        background-color: #161616;
        border: 1px solid #b6895b;
        padding: 2.5rem;
        border-radius: 1rem;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      }
      .login-card h2 {
        color: #b6895b;
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .input-group {
        margin-bottom: 1.2rem;
        display: flex;
        flex-direction: column;
      }
      .input-group label {
        color: #ddd;
        font-size: 0.9rem;
        margin-bottom: 0.4rem;
      }
      .input-group input {
        background-color: #222;
        border: 1px solid #333;
        color: #fff;
        padding: 0.8rem;
        border-radius: 0.5rem;
        outline: none;
        font-size: 1rem;
      }
      .input-group input:focus {
        border-color: #b6895b;
      }
      .btn-login {
        width: 100%;
        background-color: #b6895b;
        color: #fff;
        border: none;
        padding: 0.9rem;
        border-radius: 0.5rem;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 1rem;
      }
      .btn-login:hover {
        background-color: #9c734b;
      }
      .error-msg {
        color: #ff5c5c;
        font-size: 0.85rem;
        text-align: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h2>Admin Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Masukkan username..." required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password..." required />
        </div>
        <button type="submit" class="btn-login">Masuk Dashboard</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
    </div>

    <script>
      const loginForm = document.querySelector("#loginForm");
      const errorMsg = document.querySelector("#errorMsg");

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();
        const username = document.querySelector("#username").value;
        const password = document.querySelector("#password").value;

        try {
          const res = await fetch("http://localhost:3000/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            // Simpan status login di browser localStorage
            localStorage.setItem("isAdminLoggedIn", "true");
            window.location.href = "admin.html";
          } else {
            errorMsg.textContent = data.error || "Login gagal!";
          }
        } catch (err) {
          errorMsg.textContent = "Gagal terhubung ke server backend.";
        }
      });
    </script>
  </body>
</html>
